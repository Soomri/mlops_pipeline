# Configuración de SonarCloud para este repositorio.
# organization/projectKey deben coincidir EXACTAMENTE con los que SonarCloud
# asignó al importar el repo (Project Settings -> General en sonarcloud.io);
# si difieren de estos valores, actualízalos aquí.
sonar.organization=soomri
sonar.projectKey=Soomri_mlops_pipeline

sonar.projectName=mlops_pipeline
sonar.sources=mlops_pipeline/src

# Notebooks (.ipynb), datasets y artefactos generados no son código fuente
# analizable por Sonar; excluirlos evita ruido y falsos "archivos sin cobertura".
sonar.exclusions=**/*.ipynb,**/__pycache__/**,**/*.joblib,**/*.pkl,**/*.csv,**/*.png,**/*.json

sonar.python.version=3.11
